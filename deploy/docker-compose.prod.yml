services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: 3gods-backend-prod
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=sqlite:////app/data/database.db
      - LOG_FILE=/app/logs/backend.log
      - DEBUG=false
      - ENVIRONMENT=production
    volumes:
      - ./data:/app/data:rw
      - ./logs/backend:/app/logs:rw
    restart: unless-stopped
    networks:
      - 3gods_bridge
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: 3gods-frontend-prod
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - 3gods_bridge

networks:
  3gods_bridge:
    driver: bridge
